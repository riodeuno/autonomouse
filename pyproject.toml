[project]
name = "autonomouse"
version = "0.8.3"
description = "A to-do board for autonomous coding sessions."
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Abhinav Jha", email = "abhinavjha.r@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "textual>=8.2",
]

[project.scripts]
autonomouse = "autonomouse.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
src = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-repeat>=0.9.4",
    "pytest-xdist>=3.8.0",
    "ruff>=0.6",
]

# The agents' charters: from a wheel install, every session autonomouse starts runs in the
# package folder (`autonomouse.home`) and reads its charter from autonomouse/docs/. The
# worker-* agent types are in ~/.claude/agents (setup/agents/ ships them).
[tool.hatch.build.targets.wheel.force-include]
"docs" = "autonomouse/docs"
